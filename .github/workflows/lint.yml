name: linter

on:
  push: 
    paths: "*.py"
    branches: 
      - main

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: clone the repo
        uses: actions/checkout@v7

      - name: install linter for py
        run: pip install ruff

      - name: Check the py file
        run:  ruff .

        